<!doctype html>
<html lang="ru" data-sw="./sw.js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — страница не найдена · Zapret Discord</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
  try {
    var t = localStorage.getItem('tgws-theme');
    if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.dataset.theme = 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', '#fafafa');
    }
  } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>
  <canvas class="bg-canvas" id="bg" aria-hidden="true"></canvas>

  <main class="nf">
    <p class="overline">Ошибка</p>
    <div class="nf-code">404</div>
    <p>Такой страницы нет — туннель до неё не построить.</p>
    <a class="btn-primary" href="./">На главную</a>
  </main>

  <script src="app.js"></script>
</body>
</html>
